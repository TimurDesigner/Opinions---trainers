<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#6C5CE7"/>
<title>Опционы — учебный тренажёр</title>
<style>:root{
  --p:#6C5CE7;--p2:#4B3FC7;--g:#00B894;--r:#E17055;--y:#FDCB6E;
  --ink:#2D3436;--muted:#636E72;--bg:#F5F6FA;--card:#fff;--line:#ECEFF4;
  --shadow:0 10px 30px rgba(45,52,54,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#e9edf5;color:var(--ink);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit;font-size:16px}
.phone{width:min(430px,100%);margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  box-shadow:0 0 0 1px #e3e7ef, 0 24px 80px rgba(45,52,54,.12)}
.safe{padding:12px 16px 92px}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-bottom:12px}
.iconbtn{width:44px;height:44px;border:0;background:#fff;border-radius:14px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a29bfe,#6C5CE7);color:#fff;display:grid;place-items:center;font-weight:700}
.brandrow{display:flex;align-items:center;gap:10px}
.brandrow b{font-size:15px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px}
h1{font-size:24px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;margin:0 0 8px}
h3{font-size:16px;font-weight:600;margin:0 0 6px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:0 0 12px}
.btn{min-height:44px;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-p{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(108,92,231,.28)}
.btn-p:active{background:var(--p2)}
.btn-o{background:#fff;color:var(--ink);border:1.5px solid #E1E4EA}
.btn-o.wauto,.btn.wauto{width:auto}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.rowbtns{display:flex;gap:10px}
.rowbtns .btn{flex:1}
.prog{display:flex;gap:14px;align-items:center}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:conic-gradient(var(--p) calc(var(--pct)*1%), #ECEAF8 0);position:relative}
.ring::after{content:attr(data-v);position:absolute;inset:8px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--p)}
.pill{display:inline-block;background:#F0EEFF;color:var(--p);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.lesson{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;margin-bottom:8px;box-shadow:var(--shadow);min-height:56px}
.lesson.on{outline:2px solid var(--p);background:#F7F5FF}
.lesson.lock{opacity:.55}
.ncirc{width:28px;height:28px;border-radius:50%;background:#F0EEFF;color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.ncirc.done{background:var(--g);color:#fff}
.tabs-bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);
  background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px 14px;z-index:20}
.tabs-bottom a{text-align:center;font-size:11px;font-weight:600;color:#9AA0A6;padding:6px 0}
.tabs-bottom a.on{color:var(--p)}
.tabs-bottom svg{display:block;margin:0 auto 2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 8px;padding:14px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;min-height:48px}
.opt.sel{border-color:var(--p);background:#F4F1FF;box-shadow:0 0 0 3px rgba(108,92,231,.12)}
.letter{width:28px;height:28px;border-radius:8px;background:#F5F6FA;display:grid;place-items:center;font-weight:800;color:var(--muted);flex-shrink:0}
.opt.sel .letter{background:var(--p);color:#fff}
.ok{background:#E8FBF6;color:#0f766e;padding:12px;border-radius:14px}
.no{background:#FDECEA;color:#c0392b;padding:12px;border-radius:14px}
.bar{height:8px;background:#ECEAF8;border-radius:99px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--p);border-radius:99px}
.acc{border:1px solid var(--line);border-radius:16px;background:#fff;margin:8px 0;overflow:hidden}
.acc b{display:flex;justify-content:space-between;padding:14px 16px;cursor:pointer}
.acc .hid{display:none;padding:0 16px 14px;color:var(--muted)}
.acc.open .hid{display:block}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.callc,.putc{border-radius:16px;padding:12px;text-align:center}
.callc{background:#E8FBF6;color:#0f766e}
.putc{background:#FDECEA;color:#c0392b}
.field{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.field:last-child{border-bottom:0}
.field span{color:var(--muted);font-size:14px}
.field b,.field input,.field select{font-weight:700;border:0;background:transparent;text-align:right;width:90px}
.slider{width:100%;accent-color:var(--p);height:44px}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini2 .card{margin:0;text-align:center;padding:12px}
.authbox{padding:28px 16px}
input[type=email],input[type=password],input[type=number]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
.hero-mark{width:44px;height:44px;border-radius:14px;background:#F5F6FA;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px #ECEFF4}
.muted{color:var(--muted)}
.ach{display:flex;gap:10px}
.ach i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#F0EEFF;font-style:normal}
.ach i.off{filter:grayscale(1);opacity:.4}
#chart{min-height:180px}
.err{display:none;margin-top:8px}
.tog{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:44px;font-weight:700;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--p)}
.badge-pp{display:inline-block;background:#F0EEFF;color:var(--p);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
@media(min-width:900px){
  body{padding:24px 0}
  .phone{min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden}
}
</style>
</head>

const TOKEN_KEY = 'options-mvp-token'
const LDB = 'options-mvp-ldb'
const $ = (id) => document.getElementById(id)
let sessionUser = null
let bootstrapped = false

function ldb() {
  try { return JSON.parse(localStorage.getItem(LDB) || '{"users":[]}') } catch { return { users: [] } }
}
function ldsave(d) { try { localStorage.setItem(LDB, JSON.stringify(d)) } catch (e) { throw new Error('Safari блокирует сохранение. Откройте файл через «Файлы» → Safari, не через Telegram.') } }
function emptyProg() {
  return { lessons: {}, quizzes: {}, trainer: { attempts: [], best: 0, lastWrong: [], completed: false }, advancedLessons: {}, advancedQuizzes: {}, advancedTrainer: { best: 0, completed: false } }
}
function accessOf(p) {
  const bl = Array.from({ length: 10 }, (_, i) => i + 1).every((id) => p.lessons[id] === 'completed')
  const bt = Array.from({ length: 10 }, (_, i) => i + 1).every((id) => (p.quizzes[id] && p.quizzes[id].passed))
  const tr = !!p.trainer.completed
  const unlocked = bl && bt && tr
  const AN = (typeof ADVANCED_LESSONS!=='undefined' && ADVANCED_LESSONS.length) ? ADVANCED_LESSONS.length : 12
  const al = Array.from({ length: AN }, (_, i) => i + 1).every((id) => p.advancedLessons && p.advancedLessons[id] === 'completed')
  const at = Array.from({ length: AN }, (_, i) => i + 1).every((id) => p.advancedQuizzes && p.advancedQuizzes[id] && p.advancedQuizzes[id].passed)
  const atr = !!(p.advancedTrainer && p.advancedTrainer.completed)
  return {
    status: unlocked ? 'ADVANCED_UNLOCKED' : (bl ? 'BASIC_LESSONS_COMPLETED' : 'BASIC_IN_PROGRESS'),
    basic_lessons_completed: bl, basic_tests_completed: bt, basic_trainer_completed: tr,
    advanced_course_unlocked: unlocked, advanced_lessons_completed: al, advanced_tests_completed: at,
    advanced_trainer_unlocked: unlocked && at, advanced_course_completed: atr,
  }
}
function pub(u) {
  return {
    email: u.email,
    access: accessOf(u.progress),
    progress: {
      lessons: u.progress.lessons,
      quizzes: u.progress.quizzes,
      trainer: { best: u.progress.trainer.best, completed: !!u.progress.trainer.completed, lastWrong: u.progress.trainer.lastWrong || [] },
      advancedLessons: u.progress.advancedLessons || {},
      advancedQuizzes: u.progress.advancedQuizzes || {},
      advancedTrainer: u.progress.advancedTrainer || { best: 0, completed: false },
    },
  }
}
function localApi(path, body, token) {
  const pth = String(path).split('?')[0]
  const db = ldb()
  const tok = token || localStorage.getItem(TOKEN_KEY)
  const findByTok = () => db.users.find((u) => u.token === tok)
  if (pth.endsWith('/register') || pth.endsWith('api/register')) {
    const e = String(body.email || '').trim().toLowerCase()
    if (!e.includes('@')) throw new Error('Некорректный email')
    if (!body.password || String(body.password).length < 6) throw new Error('Пароль от 6 символов')
    if (db.users.some((u) => u.email === e)) throw new Error('Этот email уже зарегистрирован')
    const token = 'loc-' + Math.random().toString(36).slice(2) + Date.now().toString(36)
    const user = { email: e, password: String(body.password), token, progress: emptyProg() }
    db.users.push(user); ldsave(db)
    return { token, user: pub(user) }
  }
  if (pth.endsWith('/login') || pth.endsWith('api/login')) {
    const e = String(body.email || '').trim().toLowerCase()
    const user = db.users.find((u) => u.email === e && u.password === String(body.password || ''))
    if (!user) throw new Error('Неверный email или пароль')
    user.token = 'loc-' + Math.random().toString(36).slice(2)
    ldsave(db)
    return { token: user.token, user: pub(user) }
  }
  const user = findByTok()
  if (!user) throw new Error('Нужна авторизация')
  if (pth.endsWith('/me') || pth.endsWith('api/me')) return { user: pub(user) }
  if (pth.includes('/lesson/complete')) {
    const n = Number(body.id)
    if (user.progress.lessons[n] !== 'completed') user.progress.lessons[n] = 'in_progress'
    ldsave(db); return { user: pub(user) }
  }
  const qm = pth.match(/quiz\/(\d+)\/submit/)
  if (qm) {
    const n = Number(qm[1]); const qs = QUIZZES[n]
    let score = 0
    ;(body.answers || []).forEach((a, i) => { if (Number(a) === qs[i].answer) score++ })
    const passed = score >= 4
    user.progress.quizzes[n] = { score, passed }
    if (passed) user.progress.lessons[n] = 'completed'
    ldsave(db); return { score, passed, user: pub(user) }
  }
  if (pth.includes('trainer/submit') && !pth.includes('advanced')) {
    let score = 0; const wrong = []
    TRAINER.forEach((q, i) => {
      const ok = Number(body.answers[i]) === q.answer
      if (ok) score++; else wrong.push(q.id)
    })
    user.progress.trainer.best = Math.max(user.progress.trainer.best || 0, score)
    user.progress.trainer.lastWrong = wrong
    if (score >= 7) user.progress.trainer.completed = true
    ldsave(db); return { score, passed: score >= 7, user: pub(user) }
  }
  if (pth.includes('/advanced')) {
    const acc = accessOf(user.progress)
    if (!acc.advanced_course_unlocked) {
      const err = new Error('Продвинутый курс закрыт. Завершите базовый курс, тесты и тренажёр.')
      err.http = 403
      err.data = { message: err.message, access: acc }
      throw err
    }
    const lm = pth.match(/advanced\/lesson\/(\d+)/)
    if (lm && typeof ADVANCED_LESSONS !== 'undefined') {
      const id = Number(lm[1])
      const lesson = ADVANCED_LESSONS.find((x) => x.id === id)
      if (!lesson) throw new Error('Нет урока')
      if (user.progress.advancedLessons[id] !== 'completed') user.progress.advancedLessons[id] = 'in_progress'
      ldsave(db)
      return { lesson: lesson, user: pub(user) }
    }
    const qm = pth.match(/advanced\/quiz\/(\d+)/)
    if (qm && typeof ADVANCED_QUIZZES !== 'undefined') {
      const n = Number(qm[1])
      const qs = ADVANCED_QUIZZES[n]
      if (!qs) throw new Error('Нет теста')
      if (!body || !body.answers) return { questions: qs, user: pub(user) }
      let score = 0
      ;(body.answers || []).forEach((a, i) => { if (Number(a) === qs[i].answer) score++ })
      const passed = score >= 4
      user.progress.advancedQuizzes[n] = { score, passed }
      if (passed) user.progress.advancedLessons[n] = 'completed'
      ldsave(db)
      return { score, passed, user: pub(user) }
    }
    if (pth.includes('advanced/trainer') && typeof ADVANCED_TRAINER !== 'undefined') {
      const aqz = user.progress.advancedQuizzes || {}
      const AN = ADVANCED_LESSONS.length
      const testsOk = Array.from({length:AN},(_,i)=>i+1).every((id) => aqz[id] && aqz[id].passed)
      if (!testsOk) {
        const err = new Error('Сначала все уроки и тесты продвинутого курса.')
        err.http = 403
        throw err
      }
      if (!body || !body.answers) return { questions: ADVANCED_TRAINER, user: pub(user) }
      let score = 0
      ADVANCED_TRAINER.forEach((q, i) => {
        if (Number(body.answers[i]) === q.answer) score++
      })
      user.progress.advancedTrainer.best = Math.max(user.progress.advancedTrainer.best || 0, score)
      if (score >= 6) user.progress.advancedTrainer.completed = true
      ldsave(db)
      return { score, passed: score >= 6, user: pub(user) }
    }
  }
  throw new Error('Неизвестный запрос')
}

async function api(path, body, method) {
  const t = localStorage.getItem(TOKEN_KEY)
  const want = method || (body ? 'POST' : 'GET')
  const rel = String(path).replace(/^\//, '')
  // На телефоне (файл / Telegram) сеть не нужна — всё локально
  try {
    const data = localApi(path, body, t)
    if (data.user) sessionUser = data.user
    return data
  } catch (e0) {
    if (String(e0 && e0.message).indexOf('Неизвестный') === -1) throw e0
  }
  try {
    const url = new URL(rel, location.href.split('#')[0])
    const headers = { 'Content-Type': 'application/json', ...(t ? { Authorization: 'Bearer ' + t } : {}) }
    let res = await fetch(url, { method: want, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
    if ((res.status === 405 || res.status === 501 || res.status === 404) && body) {
      const u2 = new URL(url)
      u2.searchParams.set('_method', want)
      u2.searchParams.set('_json', JSON.stringify(body))
      res = await fetch(u2, { method: 'GET', headers: t ? { Authorization: 'Bearer ' + t } : {}, cache: 'no-store' })
    }
    if (res.ok) {
      const data = await res.json().catch(() => ({}))
      if (data.user) sessionUser = data.user
      return data
    }
    if (res.status === 404 || res.status === 405 || res.status === 501) {
      const data = localApi(path, body, t)
      if (data.user) sessionUser = data.user
      return data
    }
    const data = await res.json().catch(() => ({}))
    const err = new Error(data.message || data.error || ('Ошибка сервера ' + res.status))
    err.http = res.status; err.data = data; throw err
  } catch (e) {
    if (e.http && e.http !== 404) throw e
    const data = localApi(path, body, t)
    if (data.user) sessionUser = data.user
    return data
  }
}

function user() {
  if (!sessionUser) return null
  const p = sessionUser.progress || {}
  return {
    email: sessionUser.email,
    access: accessOf(p),
    progress: {
      lessons: p.lessons || {},
      quizzes: p.quizzes || {},
      trainer: {
        attempts: [],
        best: (p.trainer && p.trainer.best) || 0,
        lastWrong: (p.trainer && p.trainer.lastWrong) || [],
        completed: !!(p.trainer && p.trainer.completed),
      },
      missions: JSON.parse(localStorage.getItem('missions-' + sessionUser.email) || '{}'),
      advancedLessons: p.advancedLessons || {},
      advancedQuizzes: p.advancedQuizzes || {},
      advancedTrainer: p.advancedTrainer || { best: 0, completed: false },
    },
  }
}
function mut(fn) {
  const u = user()
  if (!u) return
  fn(u.progress)
  try { localStorage.setItem('missions-' + u.email, JSON.stringify(u.progress.missions || {})) } catch (e) {}
  try {
    var db = ldb(); var tok = localStorage.getItem(TOKEN_KEY)
    var uu = db.users.find(function(x){ return x.token === tok })
    if (uu) {
      uu.progress = uu.progress || emptyProg()
      uu.progress.lessons = u.progress.lessons
      uu.progress.quizzes = u.progress.quizzes
      uu.progress.trainer = Object.assign({}, uu.progress.trainer||{}, u.progress.trainer)
      uu.progress.advancedLessons = u.progress.advancedLessons || {}
      uu.progress.advancedQuizzes = u.progress.advancedQuizzes || {}
      uu.progress.advancedTrainer = u.progress.advancedTrainer || { best: 0, completed: false }
      ldsave(db)
      var missions = u.progress.missions
      sessionUser = pub(uu)
      if (sessionUser && sessionUser.progress) sessionUser.progress.missions = missions
    }
  } catch (e) {}
}

function plCall(S,K,P){ return Math.max(0, S-K) - P }
function plPut(S,K,P){ return Math.max(0, K-S) - P }
function plProt(S,K,P,S0){ return (S - S0) + Math.max(0, K-S) - P }
function pl(pos,S,K,P,S0){
  if (pos==='put') return plPut(S,K,P)
  if (pos==='prot') return plProt(S,K,P,S0)
  return plCall(S,K,P)
}
function be(pos,K,P,S0){
  if (pos==='put') return K-P
  if (pos==='prot') return (S0==null?100:S0)+P
  return K+P
}
function intrinsic(pos,S,K){ return (pos==='put'||pos==='prot') ? Math.max(0,K-S) : Math.max(0,S-K) }
function money(pos,S,K){
  if (Math.abs(S-K) < 0.5) return 'ATM'
  if (pos==='put' || pos==='prot') return S < K ? 'ITM' : 'OTM'
  return S > K ? 'ITM' : 'OTM'
}
function effectivePos(){
  if (lab.hold && (lab.pos==='put' || lab.pos==='prot')) return 'prot'
  if (lab.pos==='prot') return lab.hold ? 'prot' : 'put'
  if (lab.pos==='cmp') return 'call'
  return lab.pos
}

function doneCount(p){return LESSONS.filter(function(l){return p.lessons[l.id]==='completed'}).length}
function nextLesson(p){
  for(var i=1;i<=10;i++){ if(p.lessons[i]!=='completed') return i }
  return 10
}
function unlocked(p,id){
  if(id===1) return true
  return !!(p.quizzes[id-1] && p.quizzes[id-1].passed)
}
function missionCount(p){
  return Object.keys((p && p.missions) || {}).filter(function(k){return p.missions[k]}).length
}
function trainerOpen(p){ return missionCount(p) >= 10 }
function v3Open(){
  var u=user(); if(!u) return false
  try { return !!accessOf(u.progress).advanced_course_unlocked } catch(e){ return !!(u.access && u.access.advanced_course_unlocked) }
}
function v3Card(){
  var p=user().progress, open=v3Open()
  var need=[]
  if(doneCount(p)<10) need.push('уроки '+doneCount(p)+'/10')
  var tests=LESSONS.filter(function(l){return p.quizzes[l.id]&&p.quizzes[l.id].passed}).length
  if(tests<10) need.push('тесты '+tests+'/10')
  if(!p.trainer.completed) need.push('финальный тренажёр')
  return `<a class="card" href="#/app/advanced" style="display:flex;justify-content:space-between;align-items:center;background:${open?'#F7F5FF':'#fff'}">
    <div>
      <div class="pill">${open?'Открыт':'Закрыт'}</div>
      <b>${open?'':'🔒 '}Продвинутый курс</b>
      <div class="sub">${open?'5 уроков: цена до экспирации, риск, конструкции':'Цель после базы: '+need.join(' · ')}</div>
    </div><span>›</span>
  </a>`
}
function v3UnlockedLesson(p,id){
  if(id===1) return true
  return !!(p.advancedQuizzes && p.advancedQuizzes[id-1] && p.advancedQuizzes[id-1].passed)
}
function v3CourseBlock(){
  var open=v3Open(), p=user().progress
  var head=`<p class="muted" style="font-weight:700;margin:18px 0 8px">Продвинутый курс</p>`
  if(!open){
    return head+`<div class="card">
      <b>🔒 Пока закрыт — и это нормально</b>
      <p class="muted">Пройдите базовый курс целиком, чтобы открыть следующий уровень.</p>
      <ul class="muted">
        <li>10 уроков базового курса</li>
        <li>10 тестов</li>
        <li>10 миссий лаборатории</li>
        <li>Финальный тренажёр</li>
      </ul>
      <a class="btn btn-p" href="#/app">К прогрессу</a>
    </div>`
  }
  var tot=ADVANCED_LESSONS.length
  var htmlx = head
  ADVANCED_MODULES.forEach(function(mod){
    htmlx += `<p class="muted" style="font-weight:700;margin:14px 0 8px">${mod.title}</p>`
    htmlx += mod.lessons.map(function(id){
      var l=ADVANCED_LESSONS.find(function(x){return x.id===id})
      var done=p.advancedLessons && p.advancedLessons[id]==='completed'
      var un=v3UnlockedLesson(p,id)
      return `<a class="lesson ${un&&!done?'on':''} ${un?'':'lock'}" href="${un?'#/adv/lesson/'+id:'#/app/advanced'}">
        <div class="ncirc ${done?'done':''}">${done?'✓':id}</div>
        <div style="flex:1"><b>${l.title}</b></div>
        <div>${done?'':(un?'›':'🔒')}</div>
      </a>`
    }).join('')
  })
  var acc=accessOf(p)
  htmlx += acc.advanced_trainer_unlocked
    ? `<a class="btn btn-p" href="#/adv/trainer">Продвинутый тренажёр</a>`
    : `<p class="muted">Продвинутый тренажёр откроется после ${tot} тестов.</p>`
  return htmlx
}

function pctOf(p){
  var d=doneCount(p)
  var m=Object.keys(p.missions||{}).filter(function(k){return p.missions[k]}).length
  return Math.min(100, Math.round(d*8 + m*2 + (p.trainer.best||0)))
}

  return `<div class="acc card" data-acc style="padding:0;overflow:hidden">
    <b style="display:flex;align-items:center;gap:10px;padding:16px">
      <div style="flex:1">
        <div class="pill">Тренажёр</div>
        <div>Лаборатория опционов</div>
        <div class="sub">Миссии ${n}/10</div>
      </div>
      <span>▾</span>
    </b>
    <div class="hid" style="padding:0 12px 12px">
      <a class="btn btn-o" href="#/app/lab" style="margin-bottom:8px">Открыть лабораторию</a>
      ${MISSIONS.map(function(m){
        var done=!!p[m.id]
        return `<a class="lesson" href="#/app/lab" data-mid="${m.id}">
          <div class="ncirc ${done?'done':''}">${done?'✓':m.id}</div>
          <div style="flex:1"><b>${m.title}</b></div>
          <span>${done?'готово':'›'}</span>

function coursePage(){
  var p=user().progress
  return shell('course', `
    <div class="topnav"><a class="iconbtn" href="#/app">←</a><b>Базовый курс</b><span style="font-size:22px">🏆</span></div>
    <p class="muted" style="font-weight:700;margin:4px 0 8px">Базовый курс</p>
    ${LESSONS.map(function(l){
      var done=p.lessons[l.id]==='completed'
      var open=unlocked(p,l.id)
      var cur=!done && open
      var href=open?('#/lesson/'+l.id):'#/app/course'
      return `<a class="lesson ${cur?'on':''} ${open?'':'lock'}" href="${href}">
        <div class="ncirc ${done?'done':''}">${done?'✓':l.id}</div>
        <div style="flex:1"><b>${l.title}</b></div>
        <div>${done?'':(open?'›':'🔒')}</div>
      </a>`
    }).join('')}
  `)
}

function lessonPage(n){
  var l=LESSONS.find(function(x){return x.id===n}); if(!l) return homePage()
  var p=user().progress
  if(!unlocked(p,n)) return coursePage()
  mut(function(pr){ if(pr.lessons[n]!=='completed') pr.lessons[n]='in_progress' })
  var extra=''
  if(n===2){
    extra=`<div class="duo"><div class="callc"><b>CALL</b><div>Право купить актив</div><svg width="100" height="36"><path d="M8 28 L40 18 L90 8" stroke="#00B894" fill="none" stroke-width="3"/></svg></div>
    <div class="putc"><b>PUT</b><div>Право продать актив</div><svg width="100" height="36"><path d="M8 8 L40 18 L90 28" stroke="#E17055" fill="none" stroke-width="3"/></svg></div></div>`
  }
  return shell('course', `
    ${topBack(n+' / 10', '#/app/course')}
    <div class="bar"><i style="width:${n*10}%"></i></div>
    <div style="height:12px"></div>
    <h1>${n===2?'Опционы CALL и PUT':l.title}</h1>
    ${l.body.map(function(t){return '<p>'+t+'</p>'}).join('')}
    ${extra}
    <div class="acc open" data-acc><b>Ключевые моменты <span>▾</span></b><div class="hid"><ul>${l.takeaways.map(function(t){return '<li>'+t+'</li>'}).join('')}</ul></div></div>
    <div class="acc" data-acc><b>Пример <span>▾</span></b><div class="hid">${l.example}</div></div>
    <div class="rowbtns">
      <a class="btn btn-o" href="${n>1?'#/lesson/'+(n-1):'#/app/course'}">Назад</a>
      <a class="btn btn-p" href="#/quiz/${n}">Далее</a>
    </div>
  `)
}

function quizPage(n){
  var qs=QUIZZES[n]
  if(!ui.quiz||ui.quiz.n!==n) ui.quiz={n:n,i:0,sel:null,checked:false,score:0,done:false,answers:[]}
  var s=ui.quiz
  var letters=['A','B','C','D']
  if(s.done){
    var ok=s.score>=4
    return shell('course', `
      ${topBack('Тест', '#/lesson/'+n)}
      <div class="card" style="text-align:center;padding:28px">
        <div style="font-size:40px">${ok?'🎉':'📘'}</div>
        <h2>${s.score} из 5</h2>
        <p class="muted">${ok?'Урок засчитан. Можно идти дальше.':'Нужно минимум 4 из 5. Попробуйте ещё раз.'}</p>
        ${ok?'':`<button class="btn btn-p" id="again">Ещё раз</button>`}
        ${ok?`<a class="btn btn-p" href="${n<10?'#/lesson/'+(n+1):'#/app/course'}">${n<10?'Следующий урок':'К курсу'}</a>`:''}
      </div>
    `)
  }
  var q=qs[s.i]
  return shell('course', `
    ${topBack('Тест', '#/lesson/'+n)}
    <div class="topnav" style="margin:0"><span class="muted">Вопрос ${s.i+1}</span><span class="muted">${s.i+1} / 5</span></div>
    <div class="bar"><i style="width:${((s.i)/5)*100}%"></i></div>
    <div style="height:16px"></div>
    <h2>${q.text}</h2>
    ${q.options.map(function(o,idx){
      return `<button class="opt ${s.sel===idx?'sel':''}" data-i="${idx}" ${s.checked?'disabled':''}><span class="letter">${letters[idx]||(idx+1)}</span><span>${o}</span></button>`
    }).join('')}
    ${!s.checked?`<button class="btn btn-p" id="ans" ${s.sel==null?'disabled':''}>Ответить</button>`:
      `<div class="${s.sel===q.answer?'ok':'no'}">${s.sel===q.answer?'Верно! ':'Пока нет. '}${q.explain}</div>
       <div style="height:10px"></div>
       <button class="btn btn-p" id="next">${s.i===4?'Итог':'Продолжить'}</button>`}
  `)
}

    ${topBack('Миссия '+ui.mission+' из 10', '#/app')}
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>Параметры</b><span class="muted">▾</span></div>

        <select id="ptype">

      <input class="slider" type="range" min="60" max="140" value="${lab.K}" data-k="K">
      <div class="field"><span>Премия</span><b id="lab-P-val">${lab.P}</b></div>
      <input class="slider" type="range" min="0" max="20" value="${lab.P}" data-k="P">
      <p class="sub">Результат на экспирации.</p>
    </div>
    <div class="card">
      <b>Портфель</b>
      <div class="field"><span>Базовый актив</span>
        <label class="tog"><input type="checkbox" id="hold" ${lab.hold?'checked':''}> ${lab.hold?'в портфеле':'нет'}</label>
      </div>
      ${lab.hold?`<div class="field"><span>Цена покупки</span><b id="lab-S0-val">${lab.S0}</b></div>
      <div class="field"><span>Текущая цена</span><b id="lab-spot">${lab.S}</b></div>
      <div>${epos==='prot'?'<span class="badge-pp">Protective Put</span>':'<span class="muted">Чтобы собрать Protective Put, выберите PUT</span>'}</div>`
      :`<p class="sub">Включите актив, если хотите страховать портфель путом.</p>`}

    <div class="card">
      <b>График прибыли/убытка</b>
      <div id="chart"></div>
      <div class="mini2">

        <div class="card"><div class="sub">P/L сейчас</div><b id="lab-pl" style="color:${pval>=0?'#00B894':'#E17055'}">${pval>=0?'+':''}${pval}</b></div>
      </div>
    </div>
    <div class="card">
      <div class="pill">Миссия ${ui.mission} · ${doneN}/10</div>
      <p><b>${mdef.title}</b></p>
      <p>${mdef.text}</p>
      ${mdef.options ? mdef.options.map(function(o,i){return `<button class="opt" data-ans="${i}">${o}</button>`}).join('') :
        (mdef.field==='ans'?`<input id="mans" type="number" placeholder="Ответ" value="${ui.missionAns||''}"><div style="height:8px"></div><button class="btn btn-p" id="mgo">Рассчитать</button>`:
        `<button class="btn btn-p" id="mgo">Рассчитать</button>`)}
      <div id="mfb">${ui.missionMsg?`<div class="${ui.missionOk?'ok':'no'}">${ui.missionMsg}</div>`:''}</div>
      ${ui.missionOk && ui.mission<10?`<div style="height:8px"></div><button class="btn btn-p" id="mnext">К следующей миссии</button>`:''}
    </div>
    ${trainerOpen(user().progress)
      ? '<a class="btn btn-o" href="#/trainer">Финальный тест тренажёра</a>'
      : '<div class="card"><b>🔒 Финальный тест</b><p class="muted">Откроется после 10 миссий. Сейчас '+missionCount(user().progress)+'/10.</p></div>'}

function trainerPage(retry){
  var u=user()
  var all=retry?TRAINER.filter(function(t){return (u.progress.trainer.lastWrong||[]).indexOf(t.id)>=0}):TRAINER
  if(retry&&!all.length) return shell('lab', `${topBack('Повтор','#/app/profile')}<p>Нет ошибок для повтора.</p>`)
  if(!ui.trainer||ui.trainer.retry!==retry) ui.trainer={retry:retry,i:0,sel:null,num:'',checked:false,score:0,wrong:[],done:false,list:all,answers:[]}
  var s=ui.trainer
  if(s.done){
    return shell('lab', `${topBack('Результат','#/app')}<div class="card" style="text-align:center"><h2>${s.score}/${s.list.length}</h2><p class="muted">${s.score>=7?'Тренажёр засчитан.':'Нужно набрать 7 из 10.'}</p><a class="btn btn-p" href="#/app/lab">В лабораторию</a></div>`)
  }
  var q=s.list[s.i]
  var letters=['A','B','C','D']
  return shell('lab', `
    ${topBack((retry?'Повтор ':'')+'Тренажёр', '#/app/lab')}
    <div class="muted">${s.i+1} / ${s.list.length}</div>
    <div class="bar"><i style="width:${(s.i/s.list.length)*100}%"></i></div>
    <h2>${q.text}</h2>
    ${q.type==='single'?q.options.map(function(o,idx){return `<button class="opt ${s.sel===idx?'sel':''}" data-i="${idx}"><span class="letter">${letters[idx]}</span>${o}</button>`}).join(''):`<input type="number" id="num" value="${s.num}">`}
    ${!s.checked?`<button class="btn btn-p" id="ans">Ответить</button>`:`<div class="${(q.type==='numeric'?Number(s.num)===q.answer:s.sel===q.answer)?'ok':'no'}">${(q.type==='numeric'?Number(s.num)===q.answer:s.sel===q.answer)?q.explainOk:q.explainNo}</div><div style="height:8px"></div><button class="btn btn-p" id="next">Дальше</button>`}
  `)
}

function render(){
  var r=route(), root=$('app'), u=user()
  if(r==='/'||r===''){ root.innerHTML=landing(); bind(); return }
  if(r==='/login'){ root.innerHTML=auth('l'); bind(); return }
  if(r==='/register'){ root.innerHTML=auth('r'); bind(); return }
  if(!u){ go('/login'); return }
  if(r==='/app'||r==='/app/') root.innerHTML=homePage()
  else if(r==='/app/course'||r==='/app/lessons') root.innerHTML=coursePage()
  else if(r==='/app/lab'||r==='/app/missions') root.innerHTML=labView()
  else if(r==='/app/advanced') root.innerHTML=advancedHome()
  else if(r.indexOf('/adv/lesson/')===0) root.innerHTML=advLessonPage(Number(r.split('/')[3]))
  else if(r.indexOf('/adv/quiz/')===0) root.innerHTML=advQuizPage(Number(r.split('/')[3]))
  else if(r==='/adv/trainer') root.innerHTML=advTrainerPage()
  else if(r==='/app/profile'||r==='/app/settings'||r==='/app/progress') root.innerHTML=profilePage()
  else if(r==='/app/retry') root.innerHTML=trainerPage(true)
  else if(r.indexOf('/lesson/')===0) root.innerHTML=lessonPage(Number(r.split('/')[2]))
  else if(r.indexOf('/quiz/')===0) root.innerHTML=quizPage(Number(r.split('/')[2]))
  else if(r.indexOf('/trainer')===0) root.innerHTML=trainerPage(r.indexOf('retry')>=0)
  else root.innerHTML=homePage()
  bind()
  if(r==='/app/lab'||r==='/app/missions'){
    var ch=$('chart'); if(ch) drawChart(ch, effectivePos())
  }
}

function labPos(){ return lab.pos==='cmp'?'call':lab.pos }
function updateLabHud(){
  var pos=effectivePos()
  var pval=Math.round(pl(pos,lab.S,lab.K,lab.P,lab.S0)*10)/10
  var bev=be(pos, lab.K, lab.P, lab.S0)
  var sp=$('lab-spot'); if(sp) sp.textContent=lab.S
  var el
  el=$('lab-S-val'); if(el) el.textContent=lab.S
  el=$('lab-K-val'); if(el) el.textContent=lab.K
  el=$('lab-P-val'); if(el) el.textContent=lab.P
  el=$('lab-be'); if(el) el.textContent=bev
  el=$('lab-pl'); if(el){ el.textContent=(pval>=0?'+':'')+pval; el.style.color=pval>=0?'#00B894':'#E17055' }
}
function drawChart(el, pos){
  if(!el) return
  pos = pos==='cmp'?'call':pos
  var w=Math.max(280, el.clientWidth||360), h=220, pad=36
  var xmin=60, xmax=140, ys=[], x
  for(x=xmin;x<=xmax;x+=1) ys.push(pl(pos,x,lab.K,lab.P,lab.S0))
  var ymin=Math.min(-lab.P-8, Math.min.apply(null,ys)-4)
  var ymax=Math.max(12, Math.max.apply(null,ys)+6)
  var X=function(s){return pad+(s-xmin)/(xmax-xmin)*(w-pad-12)}
  var Y=function(v){return h-24-(v-ymin)/(ymax-ymin)*(h-pad-8)}
  function seg(colorNeg){
    var d='', last=null
    for(x=xmin;x<=xmax;x+=0.5){
      var y=pl(pos,x,lab.K,lab.P,lab.S0)
      var ok=colorNeg ? (y<=0.02) : (y>=-0.02)
      if(!ok){ last=null; continue }
      d += (last==null?'M':'L')+X(x)+' '+Y(y)+' '
      last=x
    }
    return d
  }
  var zero=Y(0)
  var bev=be(pos, lab.K, lab.P, lab.S0)
  var bex=X(Math.max(xmin, Math.min(xmax, bev)))
  var curx=X(lab.S), cury=Y(pl(pos,lab.S,lab.K,lab.P,lab.S0))
  var pnow=pl(pos,lab.S,lab.K,lab.P,lab.S0)
  el.innerHTML='<svg id="plsvg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="touch-action:none;cursor:ew-resize">'+
    '<line x1="'+pad+'" y1="'+zero+'" x2="'+(w-8)+'" y2="'+zero+'" stroke="#E1E4EA" stroke-width="1"/>'+
    '<line x1="'+bex+'" y1="18" x2="'+bex+'" y2="'+(h-18)+'" stroke="#6C5CE7" stroke-width="1.5" stroke-dasharray="4 4"/>'+
    '<path d="'+seg(true)+'" fill="none" stroke="#E17055" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="'+seg(false)+'" fill="none" stroke="#00B894" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+bex+'" cy="'+zero+'" r="4" fill="#6C5CE7"/>'+
    '<rect x="'+(bex-34)+'" y="4" width="68" height="18" rx="9" fill="#6C5CE7"/>'+
    '<text x="'+bex+'" y="17" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">BE '+bev+'</text>'+
    '<circle cx="'+curx+'" cy="'+cury+'" r="7" fill="'+(pnow>=0?'#00B894':'#E17055')+'" stroke="#fff" stroke-width="2"/>'+
    '<text x="8" y="14" fill="#9AA0A6" font-size="11">P/L</text>'+
    '<text x="'+(w/2)+'" y="'+(h-4)+'" text-anchor="middle" fill="#9AA0A6" font-size="11">Цена актива</text>'+
    '</svg>'
  var svg=$('plsvg')
  if(svg){
    var drag=false
    function setFromEvt(ev){
      var e=ev.touches?ev.touches[0]:ev
      var r=svg.getBoundingClientRect()
      var s=xmin+(e.clientX-r.left-pad)/(w-pad-12)*(xmax-xmin)
      s=Math.round(Math.max(xmin, Math.min(xmax, s)))
      lab.S=s
      var sl=document.querySelector('.slider[data-k="S"]')
      if(sl) sl.value=s
      updateLabHud()
      drawChart(el, pos)
    }
    svg.onmousedown=function(ev){ drag=true; setFromEvt(ev); ev.preventDefault() }
    svg.onmousemove=function(ev){ if(drag) setFromEvt(ev) }
    window.onmouseup=function(){ drag=false }
    svg.ontouchstart=function(ev){ drag=true; setFromEvt(ev); ev.preventDefault() }
    svg.ontouchmove=function(ev){ if(drag){ setFromEvt(ev); ev.preventDefault() } }
    svg.ontouchend=function(){ drag=false }
  }
}

function bind(){
  var out=$('out'); if(out) out.onclick=function(){ try{localStorage.removeItem(TOKEN_KEY)}catch(e){} sessionUser=null; go('/') }
  var f=$('f')
  if(f) f.onsubmit=function(e){
    e.preventDefault()
    var email=$('email').value.trim().toLowerCase(), pass=$('pass').value, err=$('err')
    try{
      var path = route()==='/register' ? '/api/register' : '/api/login'
      var payload = route()==='/register' ? { email:email, password:pass, agree:true } : { email:email, password:pass }
      var data = localApi(path, payload)
      localStorage.setItem(TOKEN_KEY, data.token)
      sessionUser = data.user
      go('/app')
    }catch(ex){ err.style.display='block'; err.textContent=ex.message }
  }
  document.querySelectorAll('[data-acc]').forEach(function(a){ a.querySelector('b').onclick=function(){ a.classList.toggle('open') } })
  document.querySelectorAll('[data-mid]').forEach(function(a){
    a.onclick=function(e){
      e.preventDefault()
      var id=Number(a.getAttribute('data-mid'))
      var m=MISSIONS[id-1]
      if(!m) return
      ui.mission=id
      ui.missionOk=false; ui.missionMsg=''; ui.missionAns=''
      Object.assign(lab, DEFAULTS, m.setup||{})
      lab.pos=(m.pos==='prot'?'put':(m.pos==='cmp'?'call':m.pos))
      lab.hold=!!(m.setup && m.setup.hold)
      if(m.setup && m.setup.S0!=null) lab.S0=m.setup.S0
      go('/app/lab')
    }
  })
  function maybeAutoMission(){
    var m=MISSIONS[ui.mission-1]
    if(m && !m.field && !m.options && m.check()){
      ui.missionOk=true; ui.missionMsg=m.ok
      mut(function(p){ p.missions=p.missions||{}; p.missions[m.id]=true })
    }
  }
  var ptype=$('ptype'); if(ptype) ptype.onchange=function(){
    lab.pos=ptype.value==='prot'?'put':ptype.value
    maybeAutoMission()
    render()
  }
  var hold=$('hold'); if(hold) hold.onchange=function(){
    lab.hold=!!hold.checked
    if(lab.hold) lab.S0=lab.S
    maybeAutoMission()
    render()
  }
  document.querySelectorAll('.slider').forEach(function(sl){
    sl.oninput=function(){
      lab[sl.dataset.k]=Number(sl.value)
      updateLabHud()
      var ch=$('chart'); if(ch) drawChart(ch, effectivePos())
      var mans=$('mans')
      if(mans){ ui.missionAns=mans.value; recheckMissionLive() }
    }
    sl.onchange=function(){ render() }
  })
  var r=route()
  if(r.indexOf('/quiz/')===0){
    var n=Number(r.split('/')[2]); var qs=QUIZZES[n]; var s=ui.quiz
    document.querySelectorAll('.opt[data-i]').forEach(function(b){ b.onclick=function(){ s.sel=Number(b.dataset.i); render() } })
    var ans=$('ans'); if(ans) ans.onclick=function(){ s.checked=true; if(s.sel===qs[s.i].answer) s.score++; s.answers[s.i]=s.sel; render() }
    var next=$('next'); if(next) next.onclick=function(){
      if(s.i===4){
        try { var rr=localApi('/api/quiz/'+n+'/submit', { answers: s.answers }); s.score=rr.score; sessionUser=rr.user } catch(e) {}
        s.done=true
      } else { s.i++; s.sel=null; s.checked=false }
      render()
    }
    var again=$('again'); if(again) again.onclick=function(){ ui.quiz={n:n,i:0,sel:null,checked:false,score:0,done:false,answers:[]}; render() }
  }
  if(r.indexOf('/trainer')===0||r==='/app/retry'){
    var s=ui.trainer
    if(s && !s.done){
      var q=s.list[s.i]
      document.querySelectorAll('.opt[data-i]').forEach(function(b){ b.onclick=function(){ s.sel=Number(b.dataset.i); render() } })
      var num=$('num'); if(num) num.oninput=function(){ s.num=num.value }
      var ans=$('ans'); if(ans) ans.onclick=function(){
        var ok=q.type==='numeric'?Number(s.num)===q.answer:s.sel===q.answer
        s.checked=true; if(ok) s.score++; else s.wrong.push(q.id); render()
      }
      var next=$('next'); if(next) next.onclick=function(){
        if(s.i===s.list.length-1){
          if(!s.retry){
            try{
              var answers=s.list.map(function(qq,i){return qq.type==='numeric'?null:null})
              // persist best locally via mut + trainer completed if score>=7
              mut(function(p){ p.trainer.best=Math.max(p.trainer.best||0,s.score); p.trainer.lastWrong=s.wrong; if(s.score>=7) p.trainer.completed=true })
              var db=ldb(); var tok=localStorage.getItem(TOKEN_KEY); var uu=db.users.find(function(x){return x.token===tok}); if(uu){ uu.progress.trainer.best=Math.max(uu.progress.trainer.best||0,s.score); uu.progress.trainer.lastWrong=s.wrong; if(s.score>=7) uu.progress.trainer.completed=true; ldsave(db); sessionUser=pub(uu) }
            }catch(e){}
          }
          s.done=true
        } else { s.i++; s.sel=null; s.num=''; s.checked=false }
        render()
      }
    }
  }
  function recheckMissionLive(){
    var m=MISSIONS[ui.mission-1]
    if(!m || m.field!=='ans') return
    var ans=ui.missionAns
    if(ans===undefined || ans===null || String(ans)==='' ) return
    var ok=m.check(ans)
    ui.missionOk=ok; ui.missionMsg=ok?m.ok:m.no
    if(ok) mut(function(p){ p.missions=p.missions||{}; p.missions[m.id]=true })
    var fb=$('mfb')
    if(fb) fb.innerHTML=ui.missionMsg?'<div class="'+(ok?'ok':'no')+'">'+ui.missionMsg+'</div>':''
  }
  var mgo=$('mgo')
  function checkMission(ans){
    if($('mans')) ui.missionAns=$('mans').value
    var m=MISSIONS[ui.mission-1]
    var ok=m.check(ans)
    ui.missionOk=ok; ui.missionMsg=ok?m.ok:m.no
    if(ok) mut(function(p){ p.missions=p.missions||{}; p.missions[m.id]=true })
    render()
  }
  if(mgo) mgo.onclick=function(){ var v=$('mans')?$('mans').value:null; ui.missionAns=v; checkMission(v) }
  var mans=$('mans'); if(mans) mans.oninput=function(){ ui.missionAns=mans.value; recheckMissionLive() }
  document.querySelectorAll('.opt[data-ans]').forEach(function(b){ b.onclick=function(){ checkMission(b.dataset.ans) } })
  var mnext=$('mnext'); if(mnext) mnext.onclick=function(){
    if(!ui.missionOk) return
    ui.mission=Math.min(10, ui.mission+1)
    var m=MISSIONS[ui.mission-1]
    Object.assign(lab, DEFAULTS, m.setup||{})
    lab.pos=(m.pos==='prot'?'put':(m.pos==='cmp'?'call':m.pos))
    lab.hold=!!(m.setup && m.setup.hold)
    if(m.setup && m.setup.S0!=null) lab.S0=m.setup.S0
    ui.missionOk=false; ui.missionMsg=''; ui.missionAns=''
    render()
  }
}
